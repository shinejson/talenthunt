# ==============================================================================
# StageLight Ghana Talent Hunt — Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream stagelight_upstream {
    server 127.0.0.1:5050;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=vote_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name stagelight.com.gh www.stagelight.com.gh;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stagelight.com.gh www.stagelight.com.gh;

    # TLS Certificates (managed by Certbot or Cloudflare)
    ssl_certificate /etc/letsencrypt/live/stagelight.com.gh/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stagelight.com.gh/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum client request body (permits 40MB video uploads)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static Assets Caching (styles, vendor, app scripts, images)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|woff2?|eot|ttf)$ {
        root /app/frontend;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri @backend;
    }

    # Video / Audio Media Stream Delivery (with Byte Range Support)
    location /uploads/ {
        alias /app/backend/uploads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
    }

    # API Endpoints (Proxied to Gunicorn WSGI)
    location /api/ {
        limit_req zone=api_general burst=50 nodelay;

        proxy_pass http://stagelight_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Strict rate limit for vote checkout initialization
    location /api/v1/voting/orders {
        limit_req zone=vote_limit burst=20 nodelay;

        proxy_pass http://stagelight_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to SPA index.html
    location / {
        root /app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Named fallback to backend WSGI
    location @backend {
        proxy_pass http://stagelight_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
